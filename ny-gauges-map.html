<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New York USGS Gauges Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { position: absolute; top: 72px; right: 0; bottom: 0; left: 0; }
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 72px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 1px 18px rgba(0,0,0,0.12);
      z-index: 1000;
      backdrop-filter: blur(8px);
    }
    .topbar a {
      color: #0f4c81;
      text-decoration: none;
      font-weight: 600;
    }
    .topbar .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #163d57;
      white-space: nowrap;
    }
    .topbar .subtitle {
      color: #4b5f75;
      font-size: 0.95rem;
      margin-left: auto;
    }
    .info-box {
      position: absolute;
      bottom: 18px;
      left: 18px;
      max-width: 320px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      line-height: 1.5;
      font-size: 0.95rem;
      z-index: 1000;
    }
    .info-box strong { color: #163d57; }
    .info-box a { color: #0f4c81; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">New York USGS Gauge Map</div>
    <a href="canoe-launch-finder.html">Back to launch finder</a>
    <div class="subtitle" id="status">Loading NY gauges…</div>
  </div>
  <div id="map"></div>
  <div class="info-box">
    <strong>Click a gauge marker</strong> to load its latest water height and nearby weather.
    <div style="margin-top: 10px;">
      Gauges shown are active New York streamgages with real-time water level data.
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const map = L.map('map').setView([43.0, -75.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 18,
    }).addTo(map);

    function parseRdb(text) {
      const lines = text.split(/\r?\n/).filter((line) => line.trim().length > 0 && !line.startsWith('#'));
      if (lines.length < 2) return [];
      const header = lines[0].split('\t');
      return lines.slice(2).map((line) => {
        const values = line.split('\t');
        return header.reduce((obj, key, index) => {
          obj[key] = values[index] === undefined ? '' : values[index];
          return obj;
        }, {});
      }).filter((site) => site.dec_lat_va && site.dec_long_va);
    }

    async function fetchSites() {
      const url = 'https://waterservices.usgs.gov/nwis/site/?format=rdb&stateCd=NY&siteType=ST&parameterCd=00065&siteStatus=active';
      const response = await fetch(url);
      if (!response.ok) throw new Error('Unable to fetch USGS sites');
      const text = await response.text();
      return parseRdb(text);
    }

    async function fetchWaterHeight(siteNo) {
      const url = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${encodeURIComponent(siteNo)}&parameterCd=00065&siteStatus=active`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('Failed to fetch water height');
      const data = await response.json();
      const timeSeries = data.value?.timeSeries || [];
      if (timeSeries.length === 0) return null;
      const reading = timeSeries[0].values?.[0]?.value?.[0];
      return reading ? { value: reading.value, unit: reading.value ? timeSeries[0].variable.unit?.unitCode || 'ft' : 'ft', time: reading.dateTime } : null;
    }

    async function fetchWeather(lat, lon) {
      const pointRes = await fetch(`https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`);
      if (!pointRes.ok) throw new Error('Weather point lookup failed');
      const point = await pointRes.json();
      const forecastUrl = point.properties?.forecast;
      if (!forecastUrl) throw new Error('No forecast available');
      const forecastRes = await fetch(forecastUrl);
      if (!forecastRes.ok) throw new Error('Weather forecast fetch failed');
      const forecastData = await forecastRes.json();
      const now = forecastData.properties?.periods?.[0];
      return now ? {
        temperature: now.temperature,
        unit: now.temperatureUnit,
        short: now.shortForecast,
        detailed: now.detailedForecast,
        windSpeed: now.windSpeed,
        windDirection: now.windDirection,
      } : null;
    }

    function formatPopup(site) {
      const container = document.createElement('div');
      container.style.maxWidth = '260px';

      const title = document.createElement('strong');
      title.textContent = site.station_nm;
      container.appendChild(title);
      container.insertAdjacentHTML('beforeend', '<br />');
      container.insertAdjacentHTML('beforeend', `<small>USGS ${site.site_no}</small><br />`);
      container.insertAdjacentHTML('beforeend', `<small>${site.dec_lat_va}, ${site.dec_long_va}</small><br />`);

      const status = document.createElement('div');
      status.className = 'gauge-status';
      status.style.marginTop = '8px';
      status.style.color = '#555';
      status.textContent = 'Loading conditions…';
      container.appendChild(status);

      return container;
    }

    async function loadGaugeInfo(site, popup) {
      const content = popup.getContent();
      const container = content instanceof HTMLElement
        ? content.querySelector('.gauge-status')
        : document.querySelector('.gauge-status');
      if (!container) {
        console.warn('Gauge status container not found for', site.site_no);
        return;
      }
      container.textContent = 'Loading water height…';
      try {
        const [water, weather] = await Promise.all([
          fetchWaterHeight(site.site_no),
          fetchWeather(parseFloat(site.dec_lat_va), parseFloat(site.dec_long_va)),
        ]);
        const waterText = water
          ? `${water.value} ${water.unit} as of ${new Date(water.time).toLocaleString()}`
          : 'No real-time height available';
        const weatherText = weather
          ? `${weather.temperature}°${weather.unit}, ${weather.short}`
          : 'No weather data available';
        const windText = weather
          ? `${weather.windSpeed}${weather.windDirection ? ` ${weather.windDirection}` : ''}`
          : 'Unavailable';
        container.innerHTML = `
          <strong>Water:</strong> ${waterText}<br />
          <strong>Weather:</strong> ${weatherText}<br />
          <span title="Wind speed and direction">Wind:</span> ${windText}
        `;
        popup.update();
      } catch (err) {
        container.innerHTML = `<span style="color:#a00;">${err.message}</span>`;
        popup.update();
      }
    }

    async function initMap() {
      try {
        const sites = await fetchSites();
        statusEl.textContent = `${sites.length} gauges loaded`;

        const cluster = L.markerClusterGroup();
        sites.forEach((site) => {
          const lat = parseFloat(site.dec_lat_va);
          const lon = parseFloat(site.dec_long_va);
          if (Number.isNaN(lat) || Number.isNaN(lon)) return;
          const marker = L.marker([lat, lon]);
          marker.bindPopup(formatPopup(site), { minWidth: 240 });
          marker.on('popupopen', (event) => loadGaugeInfo(site, event.popup));
          cluster.addLayer(marker);
        });

        map.addLayer(cluster);
      } catch (error) {
        statusEl.textContent = 'Failed to load gauges';
        console.error(error);
      }
    }

    initMap();
  </script>
</body>
</html>
