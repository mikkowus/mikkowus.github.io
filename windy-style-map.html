<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windy-Style Wind Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #eef4fb; }
    #map { position: absolute; inset: 0; }
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      min-height: 50px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(14, 46, 87, 0.305);
      color: white;
      z-index: 1000;
      box-shadow: 0 10px 36px rgba(3, 12, 31, 0.066);
    }
    .topbar .brand { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }
    .topbar .subtitle { color: #d2e3ff; font-size: 0.95rem; margin-left: auto; }
    .topbar a { color: #a9cfff; text-decoration: none; font-weight: 600; }
    .map-controls-bottom {
      --toolbar-action-height: 32px;
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 1000;
      pointer-events: none;
    }
    .map-controls-bottom > * { pointer-events: auto; }
    .map-zoom-controls {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      box-sizing: border-box;
      height: var(--toolbar-action-height);
      padding: 0 4px;
      border-radius: 10px;
      background: rgba(14, 46, 87, 0.94);
      box-shadow: 0 8px 24px rgba(3, 12, 31, 0.2);
    }
    .map-zoom-controls button {
      width: 26px;
      height: 100%;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }
    .map-zoom-controls button:hover { background: rgba(255, 255, 255, 0.15); }
    .radar-controls {
      --radar-control-height: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 0 0 108px;
      width: 108px;
    }
    .radar-toggle {
      display: inline-flex;
      box-sizing: border-box;
      align-items: center;
      gap: 8px;
      justify-content: center;
      height: var(--radar-control-height);
      padding: 7px 14px;
      width: 100%;
      border: 2px solid #dc2626;
      border-radius: 999px;
      background: rgba(220, 38, 38, 0.41);
      color: #ffe4e6;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      user-select: none;
    }
    .radar-toggle:hover { background: rgba(220, 38, 38, 0.45); }
    .radar-toggle.active { background: #dc2626; border-color: #ef4444; color: white; }
    .locate-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 7px;
      border: 2px solid #2563eb;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.55);
      color: #dbeafe;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      user-select: none;
    }
    .locate-button:hover { background: rgba(37, 99, 235, 0.75); }
    .locate-button.active { background: #2563eb; border-color: #3b82f6; color: white; }
    .coords-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: 2px;
    }
    .coords-box input {
      width: 100px;
      padding: 7px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(14, 46, 87, 0.547);
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }
    .coords-box input::placeholder { color: rgba(219, 234, 254, 0.8); }
    .coords-box input:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 2px rgba(147, 197, 253, 0.28);
    }
    .coords-box button {
      height: var(--toolbar-action-height);
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(14, 46, 87, 0.85);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .coords-box button:hover { background: rgba(14, 46, 87, 1); }
    .fc-stepper {
      position: static;
      display: none;
      box-sizing: border-box;
      align-items: center;
      gap: 2px;
      background: rgba(14, 46, 87, 0.508);
      height: var(--radar-control-height);
      padding: 0 6px;
      width: 100%;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(3, 12, 31, 0.2);
      z-index: 1000;
    }
    .fc-stepper button {
      border: none;
      background: transparent;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1;
      width: auto;
      flex: 1 1 0;
      height: 100%;
      border-radius: 50%;
      cursor: pointer;
      user-select: none;
    }
    .fc-stepper button:hover { background: rgba(255,255,255,0.15); }
    .fc-stepper .fc-value {
      color: #d2e3ff;
      font-size: 0.85rem;
      font-weight: 700;
      min-width: 0;
      flex: 1 1 0;
      text-align: center;
    }
    @media (max-width: 640px) {
      .topbar { padding: 8px 10px; gap: 8px; min-height: 56px; }
      .topbar .brand { font-size: 0.95rem; }
      .topbar .subtitle { display: none; }
      .radar-toggle { font-size: 0.8rem; padding: 6px 10px; }
      .radar-controls { --radar-control-height: 30px; }
      .map-controls-bottom { --toolbar-action-height: 28px; left: 8px; right: 8px; bottom: 68px; gap: 6px; }
      .locate-button { flex: 0 0 auto; font-size: 0.8rem; padding: 6px 10px; }
      .coords-box { min-width: 0; flex: 1 1 auto; }
      .coords-box input { width: 100%; min-width: 0; font-size: 0.8rem; padding: 6px 8px; }
      .coords-box button { padding: 6px 8px; font-size: 0.78rem; }
      .status-box { top: 80px; left: 8px; right: 8px; bottom: auto; max-width: none; }
    }
    .leaflet-popup-content-wrapper { border-radius: 18px; border: 1px solid rgba(255,255,255,0.88); box-shadow: 0 14px 36px rgba(0,0,0,0.18); }
    .wind-popup { min-width: 240px; font-family: system-ui, sans-serif; color: #14233a; }
    .wind-popup .title { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
    .wind-popup .meta { color: #50637b; font-size: 0.92rem; margin-bottom: 12px; }
    .wind-popup .metric { margin: 10px 0; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .wind-popup .metric strong { display: inline-block; width: 76px; color: #0f4c81; }
    .wind-popup .wind-arrow { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; }
    .wind-popup .wind-arrow span.arrow { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; background: rgba(15, 76, 129, 0.12); color: #0f4c81; font-size: 0.75rem; font-weight: 700; }
    .status-box {
      position: fixed;
      top: 104px;
      left: 18px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
      color: #172a44;
      font-size: 0.95rem;
      z-index: 1000;
      max-width: 340px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">Home</a>
    <div class="brand">Paddle Planner!</div>
  </div>
  <div id="map"></div>
  <div class="map-controls-bottom">
    <div class="radar-controls">
      <button class="radar-toggle" id="radarToggle" type="button">Radar: Off</button>
      <div class="fc-stepper" id="fcStepper">
        <button type="button" id="fcMinus" aria-label="Earlier forecast">−</button>
        <span class="fc-value" id="fcValue">0h</span>
        <button type="button" id="fcPlus" aria-label="Later forecast">+</button>
      </div>
    </div>
    <button class="locate-button" id="locateButton" type="button"> 🧭 </button>
    <div class="coords-box">
      <input id="coordsInput" type="text" placeholder="Paste lat, lon" aria-label="Latitude and longitude" />
      <button id="coordsGo" type="button">Go</button>
    </div>
    <div class="map-zoom-controls" aria-label="Map zoom controls">
      <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
    </div>
  </div>
  <div class="status-box" id="status">Click any point on the map to load wind data.</div>

  <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="mikkowus" data-color="#FFDD00" data-emoji="🍕"  data-font="Cookie" data-text="Buy me a pizza" data-outline-color="#000000" data-font-color="#000000" data-coffee-color="#ffffff" ></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const map = L.map('map', { zoomControl: false }).setView([42.9, -75.7], 7);
    document.getElementById('zoomOut').addEventListener('click', () => map.zoomOut());
    document.getElementById('zoomIn').addEventListener('click', () => map.zoomIn());

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 18,
    }).addTo(map);

    // Optional weather radar overlay (IEM NEXRAD composite + HRRR forecast)
    const radarLayer = L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png', {
      attribution: 'Radar &copy; <a href="https://mesonet.agron.iastate.edu/">IEM NEXRAD</a>',
      opacity: 0.6,
      maxZoom: 15,
      maxNativeZoom: 8,
      zIndex: 500,
    });

    function hrrrForecastLayer(min) {
      const f = String(min).padStart(4, '0');
      return L.tileLayer(`https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/hrrr::REFD-F${f}-0/{z}/{x}/{y}.png`, {
        attribution: 'Forecast &copy; <a href="https://rapidrefresh.noaa.gov/hrrr/">HRRR</a> via <a href="https://mesonet.agron.iastate.edu/">IEM</a>',
        opacity: 0.6,
        maxZoom: 15,
        maxNativeZoom: 8,
        zIndex: 500,
      });
    }

    const radarToggle = document.getElementById('radarToggle');
    const coordsInput = document.getElementById('coordsInput');
    const coordsGo = document.getElementById('coordsGo');
    const fcStepper = document.getElementById('fcStepper');
    const fcMinus = document.getElementById('fcMinus');
    const fcPlus = document.getElementById('fcPlus');
    const fcValue = document.getElementById('fcValue');
    const stepMinutes = 60;
    const maxMinutes = 6 * stepMinutes;
    let forecastMin = 0;
    let radarOn = false;
    let currentRadarLayer = null;

    function setRadarLayer(layer) {
      if (currentRadarLayer) map.removeLayer(currentRadarLayer);
      currentRadarLayer = layer;
      currentRadarLayer.addTo(map);
    }
    

    function selectForecast(min) {
      forecastMin = min;
      fcValue.textContent = min === 0 ? '0' : `+${min / stepMinutes}h`;
      if (min === 0) {
        setRadarLayer(radarLayer);
        loadStatus('Weather radar overlay enabled (IEM NEXRAD current).');
      } else {
        setRadarLayer(hrrrForecastLayer(min));
        loadStatus(`Weather radar forecast enabled (HRRR +${min / stepMinutes}h).`);
      }
    }

    radarToggle.addEventListener('click', () => {
      radarOn = !radarOn;
      if (radarOn) {
        fcStepper.style.display = 'flex';
        selectForecast(0);
        radarToggle.classList.add('active');
        radarToggle.textContent = 'Radar: On';
      } else {
        fcStepper.style.display = 'none';
        if (currentRadarLayer) map.removeLayer(currentRadarLayer);
        currentRadarLayer = null;
        radarToggle.classList.remove('active');
        radarToggle.textContent = 'Radar: Off';
        loadStatus('Weather radar overlay disabled.');
      }
    });

    fcMinus.addEventListener('click', () => {
      if (!radarOn) return;
      selectForecast(Math.max(0, forecastMin - stepMinutes));
    });

    fcPlus.addEventListener('click', () => {
      if (!radarOn) return;
      selectForecast(Math.min(maxMinutes, forecastMin + stepMinutes));
    });

    // Locate button: center the map on the user's position
    const locateButton = document.getElementById('locateButton');
    locateButton.addEventListener('click', async () => {
      locateButton.textContent = '🧭!';
      try {
        const pos = await getCurrentPosition();
        map.setView([pos.coords.latitude, pos.coords.longitude], 11);
        locateButton.textContent = '🧭';
        loadStatus(`Centered on your location (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`);
        setTimeout(() => { locateButton.textContent = '🧭'; }, 2500);
      } catch (err) {
        locateButton.textContent = '🧭';
        loadStatus(`Location error: ${err.message}`);
      }
    });

    let clickMarker = null;
    let statusHideTimer = null;

    const gaugeIcon = L.divIcon({
      html: '<div style="width:12px;height:12px;border-radius:50%;background:#dc2626;border:2px solid #f59e0b;box-shadow:0 1px 4px rgba(0,0,0,0.25);"></div>',
      className: '',
      iconSize: [12, 12],
      iconAnchor: [6, 6],
    });

    function loadStatus(text) {
      statusEl.textContent = text;
      statusEl.style.display = 'block';
      if (statusHideTimer) clearTimeout(statusHideTimer);
      statusHideTimer = setTimeout(() => {
        statusEl.style.display = 'none';
      }, 3000);
    }

    function formatWindDirection(deg) {
      if (!deg && deg !== 0) return 'Unknown';
      const d = Number(deg);
      if (Number.isNaN(d)) return 'Unknown';
      const sectors = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      const index = Math.round(((d % 360) / 22.5)) % 16;
      return `${sectors[index]} (${d}°)`;
    }

    function makeWindPopup(lat, lon) {
      const container = document.createElement('div');
      container.className = 'wind-popup';

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = 'Wind observation';
      container.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `Lat ${lat.toFixed(4)}, Lon ${lon.toFixed(4)} <button class="copy-coords-btn" data-lat="${lat}" data-lon="${lon}" type="button" style="margin-left:6px;padding:2px 8px;border:1px solid #d0d0d0;border-radius:4px;background:#f0f0f0;cursor:pointer;font-size:0.75rem;">Copy</button>`;
      container.appendChild(meta);

      const directions = document.createElement('div');
      directions.className = 'metric';
      directions.innerHTML = `<a href="https://www.google.com/maps/search/${lat},${lon}" target="_blank" rel="noopener" style="color:#0f4c81;font-weight:700;">Google Maps pin</a>`;
      container.appendChild(directions);

      const status = document.createElement('div');
      status.className = 'metric';
      status.textContent = 'Loading wind data…';
      container.appendChild(status);

      return { container, status };
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    async function handleCopyCoords(buttonEl) {
      const lat = Number(buttonEl.dataset.lat);
      const lon = Number(buttonEl.dataset.lon);
      if (Number.isNaN(lat) || Number.isNaN(lon)) {
        loadStatus('Could not copy coordinates from this popup.');
        return;
      }
      const text = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
      const original = buttonEl.textContent;
      try {
        await copyTextToClipboard(text);
        buttonEl.textContent = 'Copied';
        loadStatus(`Copied ${text}`);
      } catch (err) {
        buttonEl.textContent = 'Failed';
        loadStatus('Clipboard permission denied. Copy manually from popup.');
      }
      setTimeout(() => {
        buttonEl.textContent = original;
      }, 1200);
    }

    async function fetchWind(lat, lon) {
      const pointRes = await fetch(`https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`);
      if (!pointRes.ok) throw new Error('Weather point lookup failed');
      const pointData = await pointRes.json();
      const forecastUrl = pointData.properties?.forecastHourly || pointData.properties?.forecast;
      if (!forecastUrl) throw new Error('No forecast available for this location');
      const forecastRes = await fetch(forecastUrl);
      if (!forecastRes.ok) throw new Error('Weather forecast fetch failed');
      const forecastData = await forecastRes.json();
      const now = forecastData.properties?.periods?.[0];
      if (!now) throw new Error('No forecast periods returned');
      return {
        temperature: now.temperature,
        unit: now.temperatureUnit,
        short: now.shortForecast,
        humidity: now.relativeHumidity?.value,
        windSpeed: now.windSpeed,
        windDirection: now.windDirection,
        detailed: now.detailedForecast,
      };
    }

    function updatePopupContent(statusEl, windData) {
      statusEl.innerHTML = `
        <div class="metric"><strong>Weather:</strong> ${windData.temperature}°${windData.unit}, ${windData.short}, ${windData.humidity != null ? windData.humidity + '% humidity' : ''}</div>
        <div class="metric"><strong>Wind:</strong> ${windData.windSpeed} ${windData.windDirection || ''}${Number(windData.windDirection) >= 0 ? ' / ' + formatWindDirection(windData.windDirection) : ''}</div>
        <div class="metric" style="color:#5b7281; font-size:0.88rem;">${windData.detailed || ''}</div>
      `;
    }

    function parseRdb(text) {
      const lines = text.split(/\r?\n/).filter((line) => line.trim().length > 0 && !line.startsWith('#'));
      if (lines.length < 2) return [];
      const header = lines[0].split('\t');
      return lines.slice(2).map((line) => {
        const values = line.split('\t');
        return header.reduce((obj, key, index) => {
          obj[key] = values[index] === undefined ? '' : values[index];
          return obj;
        }, {});
      }).filter((site) => site.dec_lat_va && site.dec_long_va);
    }

    async function fetchGaugeSites() {
      const url = 'https://waterservices.usgs.gov/nwis/site/?format=rdb&stateCd=NY&siteType=ST&parameterCd=00065&siteStatus=active';
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Unable to fetch USGS sites');
        const text = await response.text();
        const sites = parseRdb(text);
        if (sites && sites.length) return sites;
        throw new Error('Parsed zero sites from USGS');
      } catch (err) {
        console.warn('USGS fetch failed, falling back to local JSON', err);
        try {
          const fallback = await fetch('usgs-ny-sites.json');
          if (!fallback.ok) throw new Error('Fallback JSON not found');
          const data = await fallback.json();
          return data;
        } catch (err2) {
          console.error('Fallback failed', err2);
          return [];
        }
      }
    }

    async function fetchGaugeWaterHeight(siteNo) {
      const url = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${encodeURIComponent(siteNo)}&parameterCd=00065&siteStatus=active`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('Failed to fetch water height');
      const data = await response.json();
      const timeSeries = data.value?.timeSeries || [];
      if (timeSeries.length === 0) return null;
      const reading = timeSeries[0].values?.[0]?.value?.[0];
      return reading ? { value: reading.value, time: reading.dateTime } : null;
    }

    function buildGaugePopup(site) {
      const container = document.createElement('div');
      container.className = 'wind-popup';
      container.innerHTML = `
        <div class="title">${site.station_nm || 'USGS gauge'}</div>
        <div class="meta"><a href="https://waterdata.usgs.gov/monitoring-location/${site.site_no}/" target="_blank" rel="noopener noreferrer" style="color:#1d4ed8;">USGS ${site.site_no}</a></div>
        <div class="metric"><strong>Location:</strong> ${site.dec_lat_va}, ${site.dec_long_va} <button class="copy-coords-btn" data-lat="${site.dec_lat_va}" data-lon="${site.dec_long_va}" type="button" style="margin-left:6px;padding:2px 8px;border:1px solid #d0d0d0;border-radius:4px;background:#f0f0f0;cursor:pointer;font-size:0.75rem;">Copy</button></div>
        <div class="metric gauge-water-status"><strong>Status:</strong> Data loading…</div>
        <div class="metric gauge-weather-status"><strong>Weather:</strong> Loading…</div>
        <div class="metric gauge-wind-status"><strong>Wind:</strong> Loading…</div>
      `;
      L.DomEvent.disableClickPropagation(container);
      return container;
    }

    async function loadGaugeSite(site, marker) {
      const popup = marker.getPopup();
      const popupContent = popup?.getContent();
      const statusElPopup = popupContent?.querySelector('.gauge-water-status');
      const weatherElPopup = popupContent?.querySelector('.gauge-weather-status');
      const windElPopup = popupContent?.querySelector('.gauge-wind-status');
      if (statusElPopup) {
        statusElPopup.innerHTML = '<strong>Status:</strong> Data loading…';
      }
      if (weatherElPopup) {
        weatherElPopup.innerHTML = '<strong>Weather:</strong> Loading…';
      }
      if (windElPopup) {
        windElPopup.innerHTML = '<strong>Wind:</strong> Loading…';
      }
      try {
        const [water, weather] = await Promise.all([
          fetchGaugeWaterHeight(site.site_no),
          fetchWind(parseFloat(site.dec_lat_va), parseFloat(site.dec_long_va)),
        ]);

        const waterText = water
          ? `${water.value} ft as of ${new Date(water.time).toLocaleString()}`
          : 'No real-time height available';
        if (statusElPopup) {
          statusElPopup.innerHTML = `<strong>Status:</strong> ${waterText}`;
        }

        if (weatherElPopup) {
          weatherElPopup.innerHTML = `<strong>Weather:</strong> ${weather.temperature}°${weather.unit}, ${weather.short}, ${weather.humidity != null ? weather.humidity + '% humidity' : ''}`;
        }
        if (windElPopup) {
          const windDirectionText = Number(weather.windDirection) >= 0 ? ` / ${formatWindDirection(weather.windDirection)}` : '';
          windElPopup.innerHTML = `<strong>Wind:</strong> ${weather.windSpeed} ${weather.windDirection || ''}${windDirectionText}`;
        }

        if (popup) {
          marker.getPopup().setContent(popup.getContent()).update();
        }
      } catch (err) {
        if (weatherElPopup) {
          weatherElPopup.innerHTML = `<strong>Weather:</strong> <span style="color:#a00;">${err.message}</span>`;
        }
        if (windElPopup) {
          windElPopup.innerHTML = '<strong>Wind:</strong> n/a';
        }
        if (popup) {
          marker.getPopup().setContent(popup.getContent()).update();
        }
      }
    }

    async function showWindAt(lat, lon) {
      if (clickMarker) {
        clickMarker.remove();
      }

      const { container, status } = makeWindPopup(lat, lon);
      clickMarker = L.marker([lat, lon]).addTo(map);
      clickMarker.bindPopup(container).openPopup();
      loadStatus('Loading wind data...');

      try {
        const windData = await fetchWind(lat, lon);
        updatePopupContent(status, windData);
        clickMarker.getPopup().setContent(container).update();
        loadStatus(`Wind at ${lat.toFixed(4)}, ${lon.toFixed(4)} loaded`);
      } catch (err) {
        status.textContent = err.message;
        clickMarker.getPopup().setContent(container).update();
        loadStatus('Unable to load wind data');
        console.error(err);
      }
    }

    function parseCoordsInput(rawText) {
      const original = String(rawText || '').trim();
      if (!original) {
        return { error: 'Paste a latitude/longitude first.' };
      }

      // Normalize uncommon minus symbols and strip common wrappers.
      const cleaned = original
        .replace(/[−–—]/g, '-')
        .replace(/[()\[\]{}]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      function applyHemisphere(value, hemi) {
        if (!hemi) return value;
        const h = hemi.toUpperCase();
        if (h === 'S' || h === 'W') return -Math.abs(value);
        if (h === 'N' || h === 'E') return Math.abs(value);
        return value;
      }

      function dmsToDecimal(deg, min, sec, hemi) {
        const d = Number(deg);
        const m = Number(min || 0);
        const s = Number(sec || 0);
        const value = d + (m / 60) + (s / 3600);
        return applyHemisphere(value, hemi);
      }

      const dmsMatches = [...cleaned.matchAll(/(\d{1,3})\s*(?:°|deg)?\s*(\d{1,2})?\s*(?:['']|min|mins|minute|minutes)?\s*(\d+(?:\.\d+)?)?\s*(?:"|″|sec|secs|second|seconds)?\s*([NSEW])/gi)];
      if (dmsMatches.length >= 2) {
        const [latMatch, lonMatch] = dmsMatches;
        const lat = dmsToDecimal(latMatch[1], latMatch[2], latMatch[3], latMatch[4]);
        const lon = dmsToDecimal(lonMatch[1], lonMatch[2], lonMatch[3], lonMatch[4]);
        if (Number.isNaN(lat) || Number.isNaN(lon)) {
          return { error: 'Could not parse DMS coordinates.' };
        }
        if (Math.abs(lat) > 90 || Math.abs(lon) > 180) {
          return { error: 'Coordinates are outside valid ranges.' };
        }
        return { lat, lon };
      }

      const labeledLat = cleaned.match(/\b(?:lat|latitude)\s*[:=]?\s*(-?\d+(?:\.\d+)?)\s*([NS])?/i);
      const labeledLon = cleaned.match(/\b(?:lon|long|lng|longitude)\s*[:=]?\s*(-?\d+(?:\.\d+)?)\s*([EW])?/i);
      if (labeledLat && labeledLon) {
        const lat = applyHemisphere(Number(labeledLat[1]), labeledLat[2]);
        const lon = applyHemisphere(Number(labeledLon[1]), labeledLon[2]);
        if (Number.isNaN(lat) || Number.isNaN(lon)) {
          return { error: 'Could not parse numbers from labeled coordinates.' };
        }
        if (Math.abs(lat) > 90 || Math.abs(lon) > 180) {
          return { error: 'Coordinates are outside valid ranges.' };
        }
        return { lat, lon };
      }

      const hemispheres = [];
      let withHemispheres = cleaned.replace(/(-?\d+(?:\.\d+)?)\s*([NSEW])\b/gi, (_, num, hemi) => {
        hemispheres.push(hemi.toUpperCase());
        return String(applyHemisphere(Number(num), hemi));
      });

      withHemispheres = withHemispheres.replace(/\s+/g, ' ');
      const numericTokens = withHemispheres.match(/-?\d+(?:\.\d+)?/g) || [];
      if (numericTokens.length < 2) {
        return { error: 'Need two numbers like 42.95, -75.84.' };
      }

      let lat = Number(numericTokens[0]);
      let lon = Number(numericTokens[1]);
      if (Number.isNaN(lat) || Number.isNaN(lon)) {
        return { error: 'Could not parse numeric coordinates.' };
      }

      const latHemi = hemispheres.find((h) => h === 'N' || h === 'S');
      const lonHemi = hemispheres.find((h) => h === 'E' || h === 'W');
      if (latHemi) lat = applyHemisphere(lat, latHemi);
      if (lonHemi) lon = applyHemisphere(lon, lonHemi);

      // If values look swapped (e.g. "-75.8, 42.9"), fix automatically.
      if (((Math.abs(lat) > 90 && Math.abs(lon) <= 90) || (lat < -90 || lat > 90) && (lon >= -90 && lon <= 90))) {
        const temp = lat;
        lat = lon;
        lon = temp;
      }

      if (Math.abs(lat) > 90 || Math.abs(lon) > 180) {
        return { error: 'Coordinates are outside valid ranges.' };
      }

      return { lat, lon };
    }

    function goToPastedCoords() {
      const parsed = parseCoordsInput(coordsInput.value);
      if (parsed.error) {
        loadStatus(`${parsed.error} Try: 42.95, -75.84 or lat:42.95 lon:-75.84`);
        return;
      }
      map.setView([parsed.lat, parsed.lon], 11);
      showWindAt(parsed.lat, parsed.lon);
    }

    coordsGo.addEventListener('click', goToPastedCoords);
    coordsInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        goToPastedCoords();
      }
    });

    // shared cluster group so paddlespots and gauges cluster together
    const clusterGroup = L.markerClusterGroup({
      disableClusteringAtZoom: 9,
      spiderfyOnMaxZoom: true,
    });
    map.addLayer(clusterGroup);

    async function loadGaugeMarkers() {
      try {
        const sites = await fetchGaugeSites();
        const markers = [];

        sites.forEach((site) => {
          const lat = parseFloat(site.dec_lat_va);
          const lon = parseFloat(site.dec_long_va);
          if (Number.isNaN(lat) || Number.isNaN(lon)) return;
          const marker = L.marker([lat, lon], { icon: gaugeIcon });
          marker.bindPopup(buildGaugePopup(site), { minWidth: 240 });
          marker.on('popupopen', () => {
            marker.openPopup();
            loadGaugeSite(site, marker);
          });
          markers.push(marker);
        });

        clusterGroup.addLayers(markers);
        loadStatus(`Loaded ${sites.length} NY USGS gauges. Click a marker for status. Click anywhere else for wind.`);
      } catch (err) {
        console.error(err);
        loadStatus('Unable to load NY USGS gauges. USGS service may be unavailable.');
      }
    }

    // paddlespot icon (blue) and loader
    const paddlespotIcon = L.divIcon({
      html: '<div style="width:12px;height:12px;border-radius:50%;background:#2563eb;border:2px solid #60a5fa;box-shadow:0 1px 4px rgba(0,0,0,0.18);"></div>',
      className: '',
      iconSize: [12, 12],
      iconAnchor: [6, 6],
    });

    function dmsToDecimal(dms) {
      const m = dms.match(/(\d+)[°\s]+(\d+)'[\s]?(\d+(?:\.\d+)?)\"?\s*([NSEW])/i);
      if (!m) return null;
      let deg = Number(m[1]);
      const min = Number(m[2]);
      const sec = Number(m[3]);
      const dir = m[4].toUpperCase();
      let dec = deg + min/60 + sec/3600;
      if (dir === 'S' || dir === 'W') dec = -dec;
      return dec;
    }

    function getCurrentPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('Geolocation not supported'));
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          timeout: 10000,
          maximumAge: 300000,
        });
      });
    }

    function formatDriveDistance(meters) {
      const miles = meters / 1609.344;
      return miles >= 10 ? `${Math.round(miles)} mi` : `${miles.toFixed(1)} mi`;
    }

    function formatDriveDuration(seconds) {
      const mins = Math.round(seconds / 60);
      if (mins < 60) return `${mins} min`;
      const hours = Math.floor(mins / 60);
      const remainingMinutes = mins % 60;
      return remainingMinutes ? `${hours} hr ${remainingMinutes} min` : `${hours} hr`;
    }

    async function fetchDriveInfo(originLat, originLon, destLat, destLon) {
      const url = `https://router.project-osrm.org/route/v1/driving/${originLon},${originLat};${destLon},${destLat}?overview=false`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Routing request failed');
      const data = await res.json();
      if (data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error('No route found');
      return data.routes[0];
    }

    async function loadPaddlespots() {
      try {
        const res = await fetch('paddlespots_coordinates.csv');
        if (!res.ok) return; // silently skip if not present
        const text = await res.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);

        // simple CSV row splitter that handles quoted fields
        function csvSplit(line) {
          const out = [];
          let cur = '';
          let inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
              if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
              else inQuotes = !inQuotes;
              continue;
            }
            if (ch === ',' && !inQuotes) {
              out.push(cur);
              cur = '';
              continue;
            }
            cur += ch;
          }
          out.push(cur);
          return out;
        }

        if (lines.length < 1) return;
        const header = csvSplit(lines[0]).map(h => h.trim().replace(/^"|"$/g, ''));
        const lower = header.map(h => h.toLowerCase());
        const nameIndex = lower.indexOf('name');
        const notesIndex = lower.indexOf('notes');
        const latIndex = lower.indexOf('latitude');
        const lonIndex = lower.indexOf('longitude');

        const spots = [];
        const numRe = /^-?\d+(?:\.\d+)?$/;

        for (let i = 1; i < lines.length; i++) {
          const row = csvSplit(lines[i]);
          let lat = null, lon = null;

          if (latIndex !== -1 && lonIndex !== -1) {
            const la = (row[latIndex] || '').trim();
            const lo = (row[lonIndex] || '').trim();
            if (numRe.test(la) && numRe.test(lo)) {
              lat = parseFloat(la);
              lon = parseFloat(lo);
            }
          }

          // fallback: check last two columns
          if ((lat === null || lon === null) && row.length >= 2) {
            const lastTwo = row.slice(-2);
            if (numRe.test(lastTwo[0]) && numRe.test(lastTwo[1])) {
              lat = parseFloat(lastTwo[0]);
              lon = parseFloat(lastTwo[1]);
            }
          }

          if (lat === null || lon === null) continue;
          if (Number.isNaN(lat) || Number.isNaN(lon)) continue;
          // filter to NY bounding box (approx)
          if (lat < 40.0 || lat > 45.6 || lon < -80.0 || lon > -71.0) continue;
          const name = (nameIndex !== -1 ? row[nameIndex] : row[0] || '').replace(/^"|"$/g, '').trim() || 'Paddlespot';
          const notes = (notesIndex !== -1 ? row[notesIndex] : '').replace(/^"|"$/g, '').trim();
          spots.push({ name, notes, lat, lon });
        }
        


        const escapeHtml = (str) => (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        const markers = spots.map(s => {
          const m = L.marker([s.lat, s.lon], { icon: paddlespotIcon });
          const container = document.createElement('div');
          container.className = 'wind-popup';
          const notesHtml = s.notes ? `<div class="metric" style="background:#eff6ff; border-left:3px solid #2563eb; padding:6px 10px; margin:8px 0; border-radius:4px; font-size:0.88rem; color:#1e40af;">${escapeHtml(s.notes)}</div>` : '';
          container.innerHTML = `
            <div class="title">${escapeHtml(s.name)}</div>
            ${notesHtml}
            <div class="meta">Lat ${s.lat.toFixed(5)}, Lon ${s.lon.toFixed(5)} <button class="copy-coords-btn" data-lat="${s.lat}" data-lon="${s.lon}" type="button" style="margin-left:6px;padding:2px 8px;border:1px solid #d0d0d0;border-radius:4px;background:#f0f0f0;cursor:pointer;font-size:0.75rem;">Copy</button></div>
            <div class="metric"><a href="https://www.google.com/maps/search/${s.lat},${s.lon}" target="_blank" rel="noopener" style="color:#0f4c81;font-weight:700;">Google Maps pin</a></div>
            <div class="metric paddle-drive-status"><strong>Drive:</strong> Calculating…</div>
            <div class="metric paddle-weather-status"><strong>Weather:</strong> Data loading…</div>
            <div class="metric paddle-wind-status"><strong>Wind:</strong> Loading…</div>
          `;
          // Keep clicks inside the popup from bubbling to the map (which would
          // close this popup and open a wind-observation popup instead).
          L.DomEvent.disableClickPropagation(container);
          m.bindPopup(container, { minWidth: 220 });
          m.on('popupopen', async () => {
            const popup = m.getPopup();
            const content = popup.getContent();
            const driveEl = content.querySelector('.paddle-drive-status');
            const weatherEl = content.querySelector('.paddle-weather-status');
            const windEl = content.querySelector('.paddle-wind-status');
            if (driveEl) {
              try {
                const pos = await getCurrentPosition();
                const route = await fetchDriveInfo(pos.coords.latitude, pos.coords.longitude, s.lat, s.lon);
                driveEl.innerHTML = `<strong>Drive:</strong> ~${formatDriveDistance(route.distance)} · ${formatDriveDuration(route.duration)}`;
              } catch (err) {
                driveEl.innerHTML = `<strong>Drive:</strong> <span style="color:#a00;">Unavailable</span>`;
              }
            }
            if (weatherEl) weatherEl.innerHTML = '<strong>Weather:</strong> Loading…';
            if (windEl) windEl.innerHTML = '<strong>Wind:</strong> Loading…';
            try {
              const w = await fetchWind(s.lat, s.lon);
              if (weatherEl) {
                weatherEl.innerHTML = `<strong>Weather:</strong> ${w.temperature}°${w.unit}, ${w.short}, ${w.humidity != null ? w.humidity + '% humidity' : ''}`;
              }
              if (windEl) {
                const windDirectionText = Number(w.windDirection) >= 0 ? ` / ${formatWindDirection(w.windDirection)}` : '';
                windEl.innerHTML = `<strong>Wind:</strong> ${w.windSpeed} ${w.windDirection || ''}${windDirectionText}`;
              }
              popup.setContent(content).update();
            } catch (err) {
              if (weatherEl) weatherEl.innerHTML = `<strong>Weather:</strong> <span style="color:#a00;">${err.message}</span>`;
              if (windEl) windEl.innerHTML = '<strong>Wind:</strong> n/a';
              popup.setContent(content).update();
            }
          });
          return m;
        });
        clusterGroup.addLayers(markers);
        if (spots.length > 0) {
          loadStatus(`Loaded ${spots.length} paddlespots (NY). Click a marker for weather/wind info.`);
        }
      } catch (err) {
        console.error('Failed to load paddlespots', err);
      }
    }

    map.on('click', (event) => {
      const { lat, lng } = event.latlng;
      showWindAt(lat, lng);
    });

    map.on('popupopen', (event) => {
      const popupEl = event.popup?.getElement();
      if (!popupEl) return;
      const copyButtons = popupEl.querySelectorAll('.copy-coords-btn');
      copyButtons.forEach((btn) => {
        if (btn.dataset.copyBound === '1') return;
        btn.dataset.copyBound = '1';
        btn.addEventListener('click', (clickEvent) => {
          clickEvent.preventDefault();
          clickEvent.stopPropagation();
          handleCopyCoords(btn);
        });
      });
    });

    loadStatus('Click anywhere on the map to view current wind conditions.');
    loadGaugeMarkers();
    loadPaddlespots();
  </script>
</body>
</html>
