<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mikkowus.github.io</title>
  <style>
    body {

      display: flex;

      background: #f3f7fb;
      color: #1f2937;

      border-radius: 18px;

      text-align: center;

      margin: 0 0 16px;

      color: #0f4c81;

    p {

      padding: 14px 22px;
      background: #0f4c81;

      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
    }
    a.button:hover {
      background: #0b3a5c;

<body>
  <div class="container">
    <h1>New York USGS Gauges Map</h1>
